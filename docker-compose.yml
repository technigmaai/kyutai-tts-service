# Kyutai TTS Service - Docker Compose (parallel option to bare-metal)
#
# Usage:
#   docker compose up -d --build     # build + start
#   docker compose logs -f           # follow logs
#   docker compose down              # stop
#
# Requires ROCm GPU passthrough: /dev/kfd + /dev/dri, video group,
# and seccomp=unconfined (standard for ROCm in Docker).
#
# Model cache: the host's default HuggingFace / ModelScope cache dirs are
# bind-mounted into the container, so both the bare-metal and the container
# deployment share the same downloaded models (no duplicate downloads).

services:
  kyutai-tts:
    build: .
    image: kyutai-tts:latest
    container_name: kyutai-tts
    ports:
      - "7861:7861"
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video
    security_opt:
      - seccomp=unconfined
    volumes:
      # Share the host's model caches (container runs as root, HOME=/root)
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
      - ${HOME}/.cache/modelscope:/root/.cache/modelscope
    restart: unless-stopped
